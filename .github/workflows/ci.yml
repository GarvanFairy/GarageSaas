name: GarageSaas CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'codex/**', 'feature/**', 'fix/**', 'upgrade_*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-test:
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/workitem-quote-race-verification' && 'Focused WorkItem quote race verification' || 'Windows build and tests' }}
    outputs:
      runtime_fingerprint: ${{ steps.runtime_identity.outputs.fingerprint }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # Only this dedicated push ref selects focused verification. PRs and all
      # other refs retain the complete CI inventory and existing quality gates.
      CI_SQL_FOCUS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/workitem-quote-race-verification' && 'workitem-quote-race' || '' }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      OpenAI__ApiKey: ''
      EmailSettings__SmtpHost: '127.0.0.1'
      EmailSettings__SmtpPort: '1'
      EmailSettings__Username: ''
      EmailSettings__Password: ''
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Record tool versions
        run: |
          dotnet --version
          node --version

      - name: Restore
        run: dotnet restore GarageSaas.sln

      - name: Build Release
        id: build
        run: dotnet build GarageSaas.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Record runtime identity before tests
        id: runtime_identity
        if: ${{ env.CI_SQL_FOCUS == '' }}
        run: |
          $fingerprint = ./.github/scripts/Get-CiRuntimeFingerprint.ps1 -Path GarageSaas/bin/Release/net10.0
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT

      - name: Unit and in-process HTTP tests (no SQL)
        if: ${{ env.CI_SQL_FOCUS == '' }}
        run: ./.github/scripts/Invoke-CiTests.ps1 -Suite unit

      # Run even if the preceding suite failed, provided the build succeeded.
      - name: Identity diagnostic safety tests (exactly 19 required)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.CI_SQL_FOCUS == '' }}
        run: ./.github/scripts/Invoke-CiTests.ps1 -Suite identity

      - name: JavaScript client regression checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.CI_SQL_FOCUS == '' }}
        run: |
          foreach ($name in @('CoreWorkflowClient','GarageContextClient','QuoteSuggestionsClient')) {
            $path = "GarageSaas.UnitTests/TestHelpers/$name.test.cjs"
            if (!(Test-Path -LiteralPath $path)) { throw "Required client suite missing: $name" }
            node $path
            if ($LASTEXITCODE -ne 0) { throw "Client checks failed: $name" }
          }

      - name: Create isolated runner-only LocalDB instance
        id: localdb
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./.github/scripts/Start-CiLocalDb.ps1

      - name: Disposable SQL integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.localdb.outcome == 'success' }}
        env:
          GARAGESAAS_TEST_SQLSERVER: '(localdb)\GarageSaasIntegrationTests'
          GARAGESAAS_RUN_REGISTRATION_SQL_TESTS: '1'
          GARAGESAAS_RUN_INVOICE_ATOMIC_SQL_TESTS: '1'
          GARAGESAAS_RUN_QUOTE_CONVERSION_SQL_TESTS: '1'
          GARAGESAAS_RUN_QUOTE_ATOMIC_SQL_TESTS: '1'
          GARAGESAAS_RUN_QUOTE_COORDINATION_SQL_TESTS: '1'
          GARAGESAAS_RUN_CUSTOMER_VEHICLE_READ_SQL_TESTS: '1'
          GARAGESAAS_RUN_CUSTOMER_VEHICLE_MUTATION_SQL_TESTS: '1'
          GARAGESAAS_RUN_CUSTOMER_DELETION_SQL_TESTS: '1'
          GARAGESAAS_RUN_OWNERSHIP_INTEGRITY_SQL_TESTS: '1'
          GARAGESAAS_RUN_STAFF_INVITATION_SQL_TESTS: '1'
          GARAGESAAS_RUN_INVOICE_DELETION_SQL_TESTS: '1'
          GARAGESAAS_RUN_INVOICE_UPDATE_SQL_TESTS: '1'
          GARAGESAAS_RUN_MANUAL_QUOTE_ATTACHMENT_SQL_TESTS: '1'
          GARAGESAAS_RUN_WORKITEM_QUOTE_RACE_SQL_TESTS: '1'
          GARAGESAAS_RUN_EF_UPGRADE_SQL_TESTS: '1'
        run: |
          if ($env:CI_SQL_FOCUS -eq 'workitem-quote-race') {
            ./.github/scripts/Invoke-CiTests.ps1 -Suite sql -FocusWorkItemQuoteRace
          } else {
            ./.github/scripts/Invoke-CiTests.ps1 -Suite sql
          }

      - name: Write test count summary
        if: ${{ always() }}
        run: |
          foreach ($suite in @('unit','identity','sql')) {
            if ($env:CI_SQL_FOCUS -and $suite -ne 'sql') { continue }
            $path = "artifacts/test-results/$suite.trx"
            if (Test-Path -LiteralPath $path) {
              ./.github/scripts/Assert-TestResults.ps1 -Path $path -Suite $suite -SummaryOnly
            } else { "$suite`: no TRX produced; inspect build/setup and sanitized status file." >> $env:GITHUB_STEP_SUMMARY }
          }

      - name: Upload sanitized test evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-results/unit.trx
            artifacts/test-results/identity.trx
            artifacts/test-results/sql.trx
            artifacts/test-results/unit-status.json
            artifacts/test-results/identity-status.json
            artifacts/test-results/sql-status.json
          if-no-files-found: warn
          retention-days: 7

  artifact-validation:
    name: Artifact security validation (no deployment)
    needs: build-test
    if: ${{ needs.build-test.result == 'success' && (github.event_name == 'push' || github.event_name == 'pull_request') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/workitem-quote-race-verification') }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
      SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_EVENT: ${{ github.event_name }}
      TESTED_RUNTIME_FINGERPRINT: ${{ needs.build-test.outputs.runtime_fingerprint }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout exact CI validation commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require staging release prerequisite regression tests
        run: ./.github/scripts/Test-StagingReleasePrerequisites.ps1
      - name: Verify and report artifact source identity
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$' -or $commit -cne $env:EXPECTED_COMMIT -or $commit -eq ('0'*40)) { throw 'Checkout identity does not match the CI commit.' }
          if ($env:SOURCE_HEAD_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source head identity.' }
          "Validation checkout: $commit; feature/source head: $env:SOURCE_HEAD_COMMIT; event: $env:VALIDATION_EVENT. PR checkouts are merge-preview commits. This artifact is not an approved master release." >> $env:GITHUB_STEP_SUMMARY
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build Release application
        run: |
          dotnet restore GarageSaas/GarageSaas.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Artifact validation restore failed.' }
          dotnet build GarageSaas/GarageSaas.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Artifact validation build failed.' }
          ./.github/scripts/Get-CiRuntimeFingerprint.ps1 -Path GarageSaas/bin/Release/net10.0 -Expected $env:TESTED_RUNTIME_FINGERPRINT | Out-Null
      - name: Publish without rebuilding and validate package
        run: |
          dotnet publish GarageSaas/GarageSaas.csproj -c Release --no-build --no-restore --self-contained false -p:ContinuousIntegrationBuild=true -o artifacts/ci-package-validation/publish
          if ($LASTEXITCODE -ne 0) { throw 'Artifact validation publish failed.' }
          ./.github/scripts/Get-CiRuntimeFingerprint.ps1 -Path artifacts/ci-package-validation/publish -Expected $env:TESTED_RUNTIME_FINGERPRINT | Out-Null
          ./.github/scripts/New-StagingReleaseArtifact.ps1 -PublishPath artifacts/ci-package-validation/publish -OutputDirectory artifacts/ci-package-validation/package -Commit $env:EXPECTED_COMMIT
      - name: Require all 37 artifact security mutation cases
        run: ./.github/scripts/Test-StagingReleaseArtifactChecks.ps1 -Path "artifacts/ci-package-validation/package/GarageSaas-$env:EXPECTED_COMMIT.zip"
      - name: Verify complete ZIP inventory and independent SHA-256
        run: ./.github/scripts/Assert-StagingValidationArtifact.ps1 -PublishPath artifacts/ci-package-validation/publish -OutputDirectory artifacts/ci-package-validation/package -Commit $env:EXPECTED_COMMIT
      # Deliberately no upload, Azure login, OIDC, environment or deployment step.
      # The ZIP and binaries remain on this disposable runner only.
